<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine 💘</title>
  <style>
    :root { --bg1:#ffeff6; --bg2:#ffe2ef; }
    * { box-sizing: border-box; }
    body{
      margin:0; height:100vh;
      display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--bg1), var(--bg2));
      overflow:hidden;
      user-select:none;
    }
    .card{
      width:min(520px, 92vw);
      padding:28px 22px;
      background: rgba(255,255,255,.75);
      border:1px solid rgba(255, 120, 180, .25);
      border-radius:20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
      text-align:center;
      backdrop-filter: blur(6px);
      position:relative;
    }
    h1{ margin:0 0 8px; font-size: clamp(22px, 4.2vw, 34px); }
    p{ margin:0 0 18px; opacity:.8; }
    .btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    button{
      border:0; border-radius:14px;
      padding:12px 18px;
      font-size:16px; font-weight:700;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
    }
    #yes{ background:#ff3b88; color:white; }
    #yes:hover{ transform: translateY(-1px) scale(1.02); }
    #no{
      background:white; color:#ff3b88;
      border:2px solid rgba(255,59,136,.25);
      position: fixed; /* важно: можем двигать по экрану */
      left: 50%; top: 60%;
      transform: translate(-50%, -50%);
    }
    #msg{
      margin-top:14px;
      font-weight:700;
      color:#ff3b88;
      min-height: 22px;
    }
    .hearts{
      pointer-events:none;
      position:fixed; inset:0;
      overflow:hidden;
    }
    .heart{
      position:absolute;
      font-size:18px;
      opacity:.85;
      animation: floatUp 3.2s linear forwards;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      from{ transform: translateY(0) scale(1); opacity:.9; }
      to{ transform: translateY(-120px) scale(1.25); opacity:0; }
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <div class="card">
    <h1>Will you be my valentine? 💘</h1>
    <p>Choose wisely 😌</p>

    <div class="btns">
      <button id="yes">Yes</button>
      <!-- No — отдельная fixed кнопка, не внутри flex, чтобы свободно двигать -->
    </div>

    <div id="msg"></div>
  </div>

  <button id="no">No</button>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const hearts = document.getElementById("hearts");

    // Утилита: ограничить значение
    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

    function moveNoButton(awayFromX, awayFromY) {
      const pad = 12; // отступ от краёв
      const rect = noBtn.getBoundingClientRect();

      // Текущее положение (left/top в px)
      const curLeft = rect.left;
      const curTop = rect.top;

      // Вектор "от курсора"
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      let dx = centerX - awayFromX;
      let dy = centerY - awayFromY;

      // если курсор ровно по центру — зададим случайное направление
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
        dx = (Math.random() - 0.5);
        dy = (Math.random() - 0.5);
      }

      // нормализуем и прыгаем на фиксированное расстояние
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;

      const jump = 140 + Math.random() * 120; // 140..260 px
      let newLeft = curLeft + dx * jump;
      let newTop  = curTop  + dy * jump;

      // Границы экрана
      const maxLeft = window.innerWidth - rect.width - pad;
      const maxTop  = window.innerHeight - rect.height - pad;

      // Если улетели в край — случайно перекинем в допустимую область
      newLeft = clamp(newLeft, pad, maxLeft);
      newTop  = clamp(newTop, pad, maxTop);

      // применяем (для fixed — left/top именно так)
      noBtn.style.left = `${newLeft}px`;
      noBtn.style.top  = `${newTop}px`;
      noBtn.style.transform = "none";
    }

    // На ПК: убегает при приближении мыши
    noBtn.addEventListener("pointerenter", (e) => {
      moveNoButton(e.clientX, e.clientY);
    });

    // Ещё сильнее — когда прямо двигаешься к ней
    noBtn.addEventListener("pointermove", (e) => {
      moveNoButton(e.clientX, e.clientY);
    });

    // На телефоне: убегает при попытке тапнуть
    noBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      moveNoButton(e.clientX, e.clientY);
    });

    // Yes -> сообщение + сердечки
    yesBtn.addEventListener("click", () => {
      msg.textContent = "Yay! 💖 See you on Valentine’s Day!";
      burstHearts();
      noBtn.style.display = "none";
      yesBtn.disabled = true;
      yesBtn.style.opacity = "0.85";
    });

    function burstHearts() {
      for (let i = 0; i < 18; i++) {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = ["💘","💖","💕","❤️","💗"][Math.floor(Math.random()*5)];
        h.style.left = (window.innerWidth * 0.5 + (Math.random()-0.5)*220) + "px";
        h.style.top  = (window.innerHeight * 0.55 + (Math.random()-0.5)*120) + "px";
        h.style.fontSize = (16 + Math.random()*18) + "px";
        h.style.animationDuration = (2.4 + Math.random()*1.3) + "s";
        hearts.appendChild(h);
        setTimeout(() => h.remove(), 3800);
      }
    }

    // Чтобы на старте "No" был на видимом месте
    function placeNoInitial() {
      const rect = noBtn.getBoundingClientRect();
      const x = window.innerWidth * 0.58 - rect.width/2;
      const y = window.innerHeight * 0.62 - rect.height/2;
      noBtn.style.left = `${clamp(x, 12, window.innerWidth - rect.width - 12)}px`;
      noBtn.style.top  = `${clamp(y, 12, window.innerHeight - rect.height - 12)}px`;
      noBtn.style.transform = "none";
    }
    window.addEventListener("resize", placeNoInitial);
    placeNoInitial();
  </script>
</body>
</html>
